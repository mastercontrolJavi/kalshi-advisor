[project]
name = "kalshi-quant"
version = "0.1.0"
description = "Research and backtests for the KXBTC15M advisor (read-only on data/*.db)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "polars>=1.20",
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "tzdata>=2026.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
