[project]
name = "kalshi-bot"
version = "0.1.0"
description = "Trading bot for Kalshi KXBTC15M (asyncio + websockets). Paper by default; real orders only in live mode with the switch on."
requires-python = ">=3.12"
dependencies = [
    "websockets>=14",
    "cryptography>=43",
    "httpx[http2]>=0.27",
]

[project.optional-dependencies]
# Only for `python -m bot backtest` (replay of the engine's recorded journal).
research = [
    "polars>=1.20",
    "numpy>=2.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
]
